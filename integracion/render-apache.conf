<VirtualHost *:10000>
    ServerName localhost
    DocumentRoot /var/www/fruta_madre/public
    <Directory /var/www/fruta_madre/public>
        AllowOverride None
        Options -Indexes -FollowSymLinks
        Require all granted
        DirectoryIndex index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
